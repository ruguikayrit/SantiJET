name: Deploy ŞantiJET DEMİR Web (iPhone Safari)

# Yalnızca manuel acil durumlar icin. Normal akista deploy-github-pages.yml kullanilir;
# bu workflow BFA ve /staging onizlemesini ezip uretim sitesini bozabilir.

on:
  workflow_dispatch:

concurrency:
  group: pages-santijet-demir-legacy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreDWG web assets
        run: bash artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Build web
        working-directory: artifacts/santijet-demir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          DART_DEFINES=""
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            CLEAN_URL="${SUPABASE_URL%/}"
            CLEAN_URL="${CLEAN_URL%/rest/v1}"
            CLEAN_URL="${CLEAN_URL%/auth/v1}"
            CLEAN_URL="${CLEAN_URL%/storage/v1}"
            CLEAN_URL="${CLEAN_URL%/functions/v1}"
            DART_DEFINES="--dart-define=SUPABASE_URL=${CLEAN_URL} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          fi
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --pwa-strategy=none $DART_DEFINES
          perl -i -0pe 's/_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{[^}]+\}\s*\}\);/window.__SANTIJET_START_FLUTTER__&&window.__SANTIJET_START_FLUTTER__();/s' build/web/flutter_bootstrap.js
          perl -i -pe 's/_flutter\.loader\.load\(\{\}\);/window.__SANTIJET_START_FLUTTER__&&window.__SANTIJET_START_FLUTTER__();/g' build/web/flutter_bootstrap.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/santijet-demir/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
