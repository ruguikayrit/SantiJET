name: Deploy ŞantiJET GitHub Pages (DEMİR + Maliyet + Puantaj + Beton + Malzeme + PRO + Staging)

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'artifacts/santijet-demir/**'
      - 'artifacts/santijet-bfa-flutter/**'
      - 'artifacts/santijet-puantaj/**'
      - 'artifacts/santijet-beton/**'
      - 'artifacts/santijet-malzeme/**'
      - 'artifacts/santijet-ana/**'
      - '.github/workflows/deploy-github-pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: pages-santijet
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout staging (preview DEMİR)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src
          fetch-depth: 1
        continue-on-error: true

      - name: Setup Flutter (DEMİR)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-demir-3.27.4

      - name: Setup Node (DEMİR DWG)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreDWG web assets (production)
        run: bash artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Install LibreDWG web assets (staging preview)
        if: hashFiles('staging-src/artifacts/santijet-demir/scripts/setup-libredwg-web.sh') != ''
        run: bash staging-src/artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Build DEMİR (production + /demir/ preview)
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f staging-src/.github/scripts/build-santijet-pages.sh ]; then
            bash staging-src/.github/scripts/build-santijet-pages.sh
          else
            bash .github/scripts/build-santijet-pages.sh
          fi

      - name: Setup Flutter (Maliyet)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
          cache-key: flutter-maliyet-3.44.3

      - name: Build Maliyet web
        id: maliyet_build
        continue-on-error: true
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # staging push'larında staging betiği + kaynak öncelikli.
          # Script adı geçici: build-bfa-pages.sh (çıktı: /maliyet/)
          if [ -f staging-src/.github/scripts/build-bfa-pages.sh ]; then
            bash staging-src/.github/scripts/build-bfa-pages.sh
          elif [ -f .github/scripts/build-bfa-pages.sh ]; then
            bash .github/scripts/build-bfa-pages.sh
          else
            echo "::warning::build-bfa-pages.sh missing; skipping /maliyet/."
          fi

      - name: Setup Flutter (Puantaj)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-puantaj-3.27.4

      - name: Build Puantaj web (staging preview)
        id: puantaj_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # staging push'larında staging betiği öncelikli (main checkout üzerine yazar).
          if [ -f staging-src/.github/scripts/build-puantaj-pages.sh ]; then
            bash staging-src/.github/scripts/build-puantaj-pages.sh
          elif [ -f .github/scripts/build-puantaj-pages.sh ]; then
            bash .github/scripts/build-puantaj-pages.sh
          else
            echo "::error::build-puantaj-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Setup Flutter (Beton)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-beton-3.27.4

      - name: Build Beton web (staging preview)
        id: beton_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f staging-src/.github/scripts/build-beton-pages.sh ]; then
            bash staging-src/.github/scripts/build-beton-pages.sh
          elif [ -f .github/scripts/build-beton-pages.sh ]; then
            bash .github/scripts/build-beton-pages.sh
          else
            echo "::error::build-beton-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Setup Flutter (Malzeme)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-malzeme-3.27.4

      - name: Build Malzeme web (staging preview)
        id: malzeme_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f staging-src/.github/scripts/build-malzeme-pages.sh ]; then
            bash staging-src/.github/scripts/build-malzeme-pages.sh
          elif [ -f .github/scripts/build-malzeme-pages.sh ]; then
            bash .github/scripts/build-malzeme-pages.sh
          else
            echo "::error::build-malzeme-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Setup Flutter (PRO)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-pro-3.27.4

      - name: Build PRO web (staging preview)
        id: pro_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f staging-src/.github/scripts/build-pro-pages.sh ]; then
            bash staging-src/.github/scripts/build-pro-pages.sh
          elif [ -f .github/scripts/build-pro-pages.sh ]; then
            bash .github/scripts/build-pro-pages.sh
          else
            echo "::error::build-pro-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Verify site bundle
        run: |
          test -f site/index.html
          if [ ! -f site/demir/index.html ]; then
            echo "::error::DEMİR preview missing (site/demir/index.html). Ensure staging branch exists and was checked out."
            echo "::group::site tree"
            find site -maxdepth 3 -type f -name 'index.html' | sort || true
            echo "::endgroup::"
            exit 1
          fi
          if [ "${{ steps.maliyet_build.outcome }}" != "success" ]; then
            echo "::warning::Maliyet build failed; /maliyet/ may be unavailable in this deploy."
          elif [ ! -f site/maliyet/index.html ]; then
            echo "::warning::Maliyet bundle missing after build step."
          fi
          if [ ! -f site/puantaj/index.html ]; then
            echo "::error::Puantaj bundle missing (site/puantaj/index.html). Refusing to deploy a broken /puantaj/."
            exit 1
          fi
          if [ ! -f site/beton/index.html ]; then
            echo "::error::Beton bundle missing (site/beton/index.html). Refusing to deploy a broken /beton/."
            exit 1
          fi
          if [ ! -f site/malzeme/index.html ]; then
            echo "::error::Malzeme bundle missing (site/malzeme/index.html). Refusing to deploy a broken /malzeme/."
            exit 1
          fi
          if [ ! -f site/pro/index.html ]; then
            echo "::error::PRO bundle missing (site/pro/index.html). Refusing to deploy a broken /pro/."
            echo "::group::site tree"
            find site -maxdepth 3 -type f -name 'index.html' | sort || true
            echo "::endgroup::"
            exit 1
          fi
          echo "Site bundle OK:"
          find site -maxdepth 3 -type f -name 'index.html' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Büyük site paketinde Pages status reporting 10 dk'yı aşabiliyor.
          timeout: 1800000

      - name: Published URLs
        run: |
          echo "Production DEMİR: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "DEMİR: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demir/"
          echo "Maliyet: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/maliyet/"
          echo "Puantaj: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/puantaj/"
          echo "Beton: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/beton/"
          echo "Malzeme: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/malzeme/"
          echo "PRO staging: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pro/"
