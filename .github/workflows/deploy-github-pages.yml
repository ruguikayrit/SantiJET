name: Deploy ŞantiJET GitHub Pages (DEMİR + BFA + Puantaj + Beton + Staging)

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'artifacts/santijet-demir/**'
      - 'artifacts/santijet-bfa-flutter/**'
      - 'artifacts/santijet-puantaj/**'
      - 'artifacts/santijet-beton/**'
      - 'artifacts/santijet-beton-r1/**'
      - '.github/workflows/deploy-github-pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: pages-santijet
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout staging (preview DEMİR)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src
          fetch-depth: 1
        continue-on-error: true

      - name: Setup Flutter (DEMİR)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-demir-3.27.4

      - name: Setup Node (DEMİR DWG)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreDWG web assets (production)
        run: bash artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Install LibreDWG web assets (staging preview)
        if: hashFiles('staging-src/artifacts/santijet-demir/scripts/setup-libredwg-web.sh') != ''
        run: bash staging-src/artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Build DEMİR (production + staging preview)
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/build-santijet-pages.sh

      - name: Setup Flutter (BFA)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
          cache-key: flutter-bfa-3.44.3

      - name: Build BFA web
        id: bfa_build
        continue-on-error: true
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: bash .github/scripts/build-bfa-pages.sh

      - name: Setup Flutter (Puantaj)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-puantaj-3.27.4

      - name: Build Puantaj web (staging preview)
        id: puantaj_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # staging push'larında staging betiği öncelikli (main checkout üzerine yazar).
          if [ -f staging-src/.github/scripts/build-puantaj-pages.sh ]; then
            bash staging-src/.github/scripts/build-puantaj-pages.sh
          elif [ -f .github/scripts/build-puantaj-pages.sh ]; then
            bash .github/scripts/build-puantaj-pages.sh
          else
            echo "::error::build-puantaj-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Setup Flutter (Beton)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-beton-3.27.4

      - name: Build Beton web (staging preview)
        id: beton_build
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f staging-src/.github/scripts/build-beton-pages.sh ]; then
            bash staging-src/.github/scripts/build-beton-pages.sh
          elif [ -f .github/scripts/build-beton-pages.sh ]; then
            bash .github/scripts/build-beton-pages.sh
          else
            echo "::error::build-beton-pages.sh missing on main and staging"
            exit 1
          fi

      - name: Setup Flutter (Beton R1)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-beton-r1-3.27.4

      - name: Build Beton R1 web (staging preview)
        id: beton_r1_build
        continue-on-error: true
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f staging-src/.github/scripts/build-beton-r1-pages.sh ]; then
            bash staging-src/.github/scripts/build-beton-r1-pages.sh
          elif [ -f .github/scripts/build-beton-r1-pages.sh ]; then
            bash .github/scripts/build-beton-r1-pages.sh
          else
            echo "::warning::build-beton-r1-pages.sh missing; skipping /beton-r1/"
          fi

      - name: Verify site bundle
        run: |
          test -f site/index.html
          if [ ! -f site/staging/index.html ]; then
            echo "::error::staging preview missing. Ensure staging branch exists and was checked out."
            exit 1
          fi
          if [ "${{ steps.bfa_build.outcome }}" != "success" ]; then
            echo "::warning::BFA build failed; /bfa/ may be unavailable in this deploy."
          elif [ ! -f site/bfa/index.html ]; then
            echo "::warning::BFA bundle missing after build step."
          fi
          if [ ! -f site/puantaj/index.html ]; then
            echo "::error::Puantaj bundle missing (site/puantaj/index.html). Refusing to deploy a broken /puantaj/."
            exit 1
          fi
          if [ ! -f site/beton/index.html ]; then
            echo "::error::Beton bundle missing (site/beton/index.html). Refusing to deploy a broken /beton/."
            exit 1
          fi
          if [ "${{ steps.beton_r1_build.outcome }}" != "success" ]; then
            echo "::warning::Beton R1 build failed or skipped; /beton-r1/ may be unavailable."
          elif [ ! -f site/beton-r1/index.html ]; then
            echo "::warning::Beton R1 bundle missing after build step."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Published URLs
        run: |
          echo "Production DEMİR: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Staging DEMİR: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/"
          echo "BFA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/bfa/"
          echo "Puantaj staging: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/puantaj/"
          echo "Beton staging: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/beton/"
          echo "Beton R1 staging: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/beton-r1/"
