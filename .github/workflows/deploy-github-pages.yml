name: Deploy ŞantiJET GitHub Pages (DEMİR + BFA + Staging)

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'artifacts/santijet-demir/**'
      - 'artifacts/santijet-bfa-flutter/**'
      - '.github/workflows/deploy-github-pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: pages-santijet
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout staging (preview DEMİR)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src
          fetch-depth: 1
        continue-on-error: true

      - name: Setup Flutter (DEMİR)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-demir-3.27.4

      - name: Setup Node (DEMİR DWG)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreDWG web assets
        run: bash artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Build DEMİR (production + staging preview)
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/build-santijet-pages.sh

      - name: Setup Flutter (BFA)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
          cache-key: flutter-bfa-3.44.3

      - name: Build BFA web
        id: bfa_build
        continue-on-error: true
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: bash .github/scripts/build-bfa-pages.sh

      - name: Verify site bundle
        run: |
          test -f site/index.html
          if [ ! -f site/staging/index.html ]; then
            echo "::error::staging preview missing. Ensure staging branch exists and was checked out."
            exit 1
          fi
          if [ "${{ steps.bfa_build.outcome }}" != "success" ]; then
            echo "::warning::BFA build failed; /bfa/ may be unavailable in this deploy."
          elif [ ! -f site/bfa/index.html ]; then
            echo "::warning::BFA bundle missing after build step."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Published URLs
        run: |
          echo "Production: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Staging preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/"
