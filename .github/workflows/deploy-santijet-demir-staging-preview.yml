name: Deploy ŞantiJET DEMİR Staging Preview

on:
  push:
    branches:
      - staging
    paths:
      - 'artifacts/santijet-demir/**'
      - '.github/workflows/deploy-santijet-demir-staging-preview.yml'
      - '.github/workflows/deploy-github-pages.yml'
      - '.github/scripts/build-santijet-pages.sh'
  workflow_dispatch:

concurrency:
  group: pages-santijet
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (production + BFA)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout staging (preview DEMİR)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src

      - name: Setup Flutter (DEMİR)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
          cache-key: flutter-demir-3.27.4

      - name: Setup Node (DEMİR DWG)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreDWG web assets
        run: bash artifacts/santijet-demir/scripts/setup-libredwg-web.sh

      - name: Build DEMİR (production + staging preview)
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/build-santijet-pages.sh

      - name: Setup Flutter (BFA)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true
          cache-key: flutter-bfa-3.44.3

      - name: Build BFA web
        working-directory: artifacts/santijet-bfa-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href "/${{ github.event.repository.name }}/bfa/" --pwa-strategy=none
          perl -i -0pe 's/_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{[^}]+\}\s*\}\);/window.__SANTIJET_START_FLUTTER__&&window.__SANTIJET_START_FLUTTER__();/s' build/web/flutter_bootstrap.js
          perl -i -pe 's/_flutter\.loader\.load\(\{\}\);/window.__SANTIJET_START_FLUTTER__&&window.__SANTIJET_START_FLUTTER__();/g' build/web/flutter_bootstrap.js
          mkdir -p "${GITHUB_WORKSPACE}/site/bfa"
          cp -r build/web/. "${GITHUB_WORKSPACE}/site/bfa/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview URL
        run: |
          echo "Production: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Staging preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/"
