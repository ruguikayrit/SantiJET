name: santijet_puantaj
description: "ŞantiJET SAHA — Saha operasyonu, günlük rapor ve adam-gün puantaj. Demir görsel diliyle hizalı."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.2

# Bağımlılık sürümleri ŞantiJET Demir / BFA ile hizalıdır.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  archive: ^3.6.1
  http: ^1.2.2
  image_picker: ^1.1.2
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/s_logo.png
  adaptive_icon_background: '#05070A'
  adaptive_icon_foreground: assets/images/s_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: '#05070A'
  image: assets/images/s_logo.png
  android_12:
    color: '#05070A'
    image: assets/images/s_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
