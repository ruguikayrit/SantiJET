  <style>
    html {
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      /* JS ölçümü hazır olunca gerçek piksel yükseklik devreye girer —
         iOS Safari'nin dinamik adres çubuğu dvh/fixed uyumsuzluğunu düzeltir. */
      height: var(--app-height, 100dvh);
      touch-action: manipulation;
      /* Açılış koyu; Flutter tema ile syncPageBackground günceller */
      background-color: #05070A;
    }
    body {
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #05070A;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    flutter-view, flt-glass-pane {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      min-height: 100dvh;
      touch-action: manipulation;
      background-color: #05070A;
    }
    #santijet-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070A;
      color: #6B7280;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }
  </style>
  <script>
    // Gerçek görünür yükseklik (px) — iOS Safari'de adres çubuğu açılıp
    // kapanınca `position:fixed` + `dvh` senkron kalmayabilir; bu, nav bar
    // altında/altında boşluk bırakan bilinen bir WebKit sorunudur. JS ile
    // ölçülen değeri CSS değişkenine yazarak kesin ve tutarlı bir yükseklik
    // sağlanır.
    (function () {
      var root = document.documentElement;

      function setAppHeight() {
        // innerHeight öncelikli: visualViewport çoğu iOS durumda home-indicator
        // alanını dışarıda bırakır → flutter-view kısalır, altında ölü şerit kalır.
        // Klavye açıkken (viewport belirgin kısalır) visualViewport kullanılır.
        var inner = window.innerHeight || (root && root.clientHeight) || 0;
        var vv = (window.visualViewport && window.visualViewport.height) || 0;
        var h = inner;
        if (vv > 0 && inner > 0 && vv < inner * 0.85) {
          h = vv;
        } else if (inner <= 0 && vv > 0) {
          h = vv;
        }
        if (h > 0) {
          root.style.setProperty('--app-height', h + 'px');
        }
      }

      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', setAppHeight);
      }
      // Flutter ilk kareyi çizdikten kısa süre sonra bir kez daha ölç —
      // engine mount sırasında adres çubuğu durumu değişmiş olabilir.
      window.addEventListener('flutter-first-frame', function () {
        setAppHeight();
        setTimeout(setAppHeight, 300);
      }, { once: true });
    })();
  </script>
  <script>
    // ŞantiJET DEMİR — iOS PWA viewport + yükleme ekranı
    (function () {
      var APP_VERSION = '96';
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

      function clearAppCaches() {
        var tasks = [Promise.resolve()];
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            })
          );
        }
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            })
          );
        }
        return Promise.all(tasks);
      }

      window.santijetHardReload = function () {
        clearAppCaches().finally(function () {
          try {
            var prefix = 'santijet_reloaded_v';
            for (var i = localStorage.length - 1; i >= 0; i -= 1) {
              var key = localStorage.key(i);
              if (key && key.indexOf(prefix) === 0) localStorage.removeItem(key);
            }
            localStorage.setItem('santijet_app_version', APP_VERSION);
          } catch (e) {}
          location.reload();
        });
      };

      window.__SANTIJET_START_FLUTTER__ = function () {
        var version = window.__SANTIJET_APP_VERSION__ || APP_VERSION;
        if (window._flutter && _flutter.buildConfig && _flutter.buildConfig.builds) {
          _flutter.buildConfig.builds.forEach(function (build) {
            if (!build.mainJsPath) return;
            var base = build.mainJsPath.split('?')[0];
            build.mainJsPath = base + '?v=' + version;
          });
        }
        _flutter.loader.load({});
      };

      function showSlowLoadHelp() {
        var el = document.getElementById('santijet-loading');
        if (!el || !el.parentNode || isFlutterMounted()) return;
        el.innerHTML =
          'Yükleme uzun sürüyor…<br>' +
          '<span style="font-size:12px;margin-top:8px;display:block;line-height:1.45;">' +
          'Önbellek temizleyip yeniden deneyin. Sorun sürerse kısayolu silip Safari\'den tekrar Ana Ekrana Ekleyin.' +
          '</span>' +
          '<button type="button" onclick="window.santijetHardReload()" ' +
          'style="margin-top:16px;padding:10px 18px;border:none;border-radius:8px;' +
          'background:#2563EB;color:#fff;font-size:14px;">Önbelleği Temizle</button>';
      }

      function hideLoadingOverlay() {
        var el = document.getElementById('santijet-loading');
        if (el) el.remove();
      }

      function isFlutterMounted() {
        try {
          if (document.querySelector('flutter-view')) return true;
          if (document.querySelector('flt-glass-pane')) return true;
          if (document.querySelector('flt-scene-host')) return true;
          var flutterView = document.querySelector('flutter-view');
          if (flutterView && flutterView.shadowRoot) {
            if (flutterView.shadowRoot.querySelector('canvas')) return true;
            if (flutterView.shadowRoot.querySelector('flt-glass-pane')) return true;
          }
          return !!document.querySelector('canvas');
        } catch (e) {
          return false;
        }
      }

      function watchFlutterMount() {
        if (isFlutterMounted()) {
          hideLoadingOverlay();
          return;
        }

        var flutterObserver = new MutationObserver(function () {
          if (isFlutterMounted()) {
            hideLoadingOverlay();
            flutterObserver.disconnect();
          }
        });
        flutterObserver.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        var attempts = 0;
        var poll = window.setInterval(function () {
          attempts += 1;
          if (isFlutterMounted()) {
            hideLoadingOverlay();
            window.clearInterval(poll);
            flutterObserver.disconnect();
          } else if (attempts >= 120) {
            window.clearInterval(poll);
          }
        }, 500);
      }

      window.addEventListener('flutter-first-frame', hideLoadingOverlay, { once: true });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', watchFlutterMount);
      } else {
        watchFlutterMount();
      }

      setTimeout(showSlowLoadHelp, 20000);

      var storedVersion = localStorage.getItem('santijet_app_version');
      var sessionReloadKey = 'santijet_version_reload_' + APP_VERSION;
      if (storedVersion !== APP_VERSION && storedVersion !== null &&
          !sessionStorage.getItem(sessionReloadKey)) {
        localStorage.setItem('santijet_app_version', APP_VERSION);
        sessionStorage.setItem(sessionReloadKey, '1');
        clearAppCaches().finally(function () {
          location.reload();
        });
      } else {
        localStorage.setItem('santijet_app_version', APP_VERSION);
      }

      function updateSafeAreaInsets() {
        if (!document.body) return;
        try {
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);' +
            'padding-bottom:env(safe-area-inset-bottom);pointer-events:none;visibility:hidden;';
          document.body.appendChild(probe);
          var top = parseFloat(window.getComputedStyle(probe).paddingTop) || 0;
          var bottom = parseFloat(window.getComputedStyle(probe).paddingBottom) || 0;
          document.body.removeChild(probe);
          window.__SANTIJET_SAFE_AREA_TOP__ = top;
          window.__SANTIJET_SAFE_AREA_BOTTOM__ = bottom;
        } catch (e) {
          window.__SANTIJET_SAFE_AREA_TOP__ = 0;
          window.__SANTIJET_SAFE_AREA_BOTTOM__ = 0;
        }
      }

      if (isIOS) {
        if (document.body) {
          updateSafeAreaInsets();
        } else {
          document.addEventListener('DOMContentLoaded', updateSafeAreaInsets);
        }
        window.addEventListener('resize', updateSafeAreaInsets);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateSafeAreaInsets);
        }
      }

      function ensureViewportFit() {
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp && vp.content.indexOf('viewport-fit=cover') === -1) {
          vp.content = vp.content + ', viewport-fit=cover';
        }
      }
      ensureViewportFit();
      if (window.MutationObserver) {
        new MutationObserver(ensureViewportFit).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }

      if (isIOS && isStandalone) {
        var resetScroll = function () {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        };
        window.addEventListener('scroll', resetScroll, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', resetScroll);
        }
        document.addEventListener('focusin', resetScroll);
        document.addEventListener('focusout', resetScroll);
      }

      function attachTouchGuard() {
        var target = document.querySelector('flutter-view') || document.body;
        if (!target || target.__santijetTouchGuard) return;
        target.__santijetTouchGuard = true;
        target.addEventListener('touchstart', function () {}, { passive: false });
      }
      if (isIOS && isStandalone) {
        document.addEventListener('DOMContentLoaded', attachTouchGuard);
        var touchObserver = new MutationObserver(function () {
          attachTouchGuard();
        });
        if (document.body) {
          touchObserver.observe(document.body, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            touchObserver.observe(document.body, { childList: true, subtree: true });
          });
        }
        setTimeout(attachTouchGuard, 500);
        setTimeout(attachTouchGuard, 2000);
      }

      window.__SANTIJET_APP_VERSION__ = APP_VERSION;
    })();
  </script>
