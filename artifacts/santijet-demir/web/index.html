<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ŞantiJET DEMİR — Çelik Takip Sistemi">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ŞantiJET DEMİR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ŞantiJET DEMİR</title>
  <link rel="manifest" href="manifest.json?v=75">

  <!-- Supabase → passkeys_web eklentisi için zorunlu (yoksa uygulama başlamaz) -->
  <script src="passkeys_bundle.js"></script>

  <style>
    html {
      height: 100%;
      height: -webkit-fill-available;
      touch-action: manipulation;
    }
    body {
      height: 100%;
      height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0D1117;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    flutter-view, flt-glass-pane {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }
    #santijet-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070A;
      color: #6B7280;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }
  </style>
  <script>
    // ŞantiJET DEMİR — iOS PWA viewport + yükleme ekranı
    (function () {
      var APP_VERSION = '75';
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

      function hideLoadingOverlay() {
        var el = document.getElementById('santijet-loading');
        if (el) el.remove();
      }

      function isFlutterMounted() {
        try {
          if (document.querySelector('flutter-view')) return true;
          if (document.querySelector('flt-glass-pane')) return true;
          if (document.querySelector('flt-scene-host')) return true;
          var flutterView = document.querySelector('flutter-view');
          if (flutterView && flutterView.shadowRoot) {
            if (flutterView.shadowRoot.querySelector('canvas')) return true;
            if (flutterView.shadowRoot.querySelector('flt-glass-pane')) return true;
          }
          return !!document.querySelector('canvas');
        } catch (e) {
          return false;
        }
      }

      function watchFlutterMount() {
        if (isFlutterMounted()) {
          hideLoadingOverlay();
          return;
        }

        var flutterObserver = new MutationObserver(function () {
          if (isFlutterMounted()) {
            hideLoadingOverlay();
            flutterObserver.disconnect();
          }
        });
        flutterObserver.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        var attempts = 0;
        var poll = window.setInterval(function () {
          attempts += 1;
          if (isFlutterMounted()) {
            hideLoadingOverlay();
            window.clearInterval(poll);
            flutterObserver.disconnect();
          } else if (attempts >= 120) {
            window.clearInterval(poll);
          }
        }, 500);
      }

      window.addEventListener('flutter-first-frame', hideLoadingOverlay, { once: true });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', watchFlutterMount);
      } else {
        watchFlutterMount();
      }

      setTimeout(function () {
        var el = document.getElementById('santijet-loading');
        if (el && el.parentNode) {
          el.innerHTML =
            'Yükleme uzun sürüyor…<br>' +
            '<span style="font-size:12px;margin-top:8px;display:block;">' +
            'Ana ekrandaki kısayolu silip Safari\'den tekrar Ana Ekrana Ekleyin veya sayfayı yenileyin.' +
            '</span>' +
            '<button type="button" onclick="location.reload()" ' +
            'style="margin-top:16px;padding:10px 18px;border:none;border-radius:8px;' +
            'background:#2563EB;color:#fff;font-size:14px;">Yenile</button>';
        }
      }, 20000);

      var storedVersion = localStorage.getItem('santijet_app_version');
      var reloadKey = 'santijet_reloaded_v' + APP_VERSION;
      if (storedVersion !== APP_VERSION && storedVersion !== null &&
          !localStorage.getItem(reloadKey)) {
        localStorage.setItem('santijet_app_version', APP_VERSION);
        localStorage.setItem(reloadKey, '1');
        var clearCaches = Promise.resolve();
        if ('caches' in window) {
          clearCaches = caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        }
        clearCaches.then(function () {
          if ('serviceWorker' in navigator) {
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            });
          }
        }).finally(function () {
          location.reload();
        });
      } else {
        localStorage.setItem('santijet_app_version', APP_VERSION);
      }

      function updateSafeAreaInsets() {
        if (!document.body) return;
        try {
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;bottom:0;left:0;padding-bottom:env(safe-area-inset-bottom);pointer-events:none;visibility:hidden;';
          document.body.appendChild(probe);
          var bottom = parseFloat(window.getComputedStyle(probe).paddingBottom) || 0;
          document.body.removeChild(probe);
          window.__SANTIJET_SAFE_AREA_BOTTOM__ = bottom;
        } catch (e) {
          window.__SANTIJET_SAFE_AREA_BOTTOM__ = 0;
        }
      }

      if (isIOS) {
        if (document.body) {
          updateSafeAreaInsets();
        } else {
          document.addEventListener('DOMContentLoaded', updateSafeAreaInsets);
        }
        window.addEventListener('resize', updateSafeAreaInsets);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateSafeAreaInsets);
        }
      }

      function ensureViewportFit() {
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp && vp.content.indexOf('viewport-fit=cover') === -1) {
          vp.content = vp.content + ', viewport-fit=cover';
        }
      }
      ensureViewportFit();
      if (window.MutationObserver) {
        new MutationObserver(ensureViewportFit).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }

      if (isIOS && isStandalone) {
        var resetScroll = function () {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        };
        window.addEventListener('scroll', resetScroll, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', resetScroll);
        }
        document.addEventListener('focusin', resetScroll);
        document.addEventListener('focusout', resetScroll);
      }

      function attachTouchGuard() {
        var target = document.querySelector('flutter-view') || document.body;
        if (!target || target.__santijetTouchGuard) return;
        target.__santijetTouchGuard = true;
        target.addEventListener('touchstart', function () {}, { passive: false });
      }
      if (isIOS && isStandalone) {
        document.addEventListener('DOMContentLoaded', attachTouchGuard);
        var touchObserver = new MutationObserver(function () {
          attachTouchGuard();
        });
        if (document.body) {
          touchObserver.observe(document.body, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            touchObserver.observe(document.body, { childList: true, subtree: true });
          });
        }
        setTimeout(attachTouchGuard, 500);
        setTimeout(attachTouchGuard, 2000);
      }

      window.__SANTIJET_APP_VERSION__ = APP_VERSION;
    })();
  </script>
</head>
<body>
  <div id="santijet-loading">ŞantiJET yükleniyor…</div>
  <script type="module" src="dwg/dwg_bridge.js"></script>
  <script>
    (function () {
      var version = window.__SANTIJET_APP_VERSION__ || Date.now();
      var boot = document.createElement('script');
      boot.src = 'flutter_bootstrap.js?v=' + version;
      boot.async = true;
      document.body.appendChild(boot);
    })();
  </script>
</body>
</html>
