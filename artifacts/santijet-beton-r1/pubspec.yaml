name: santijet_beton_r1
description: "ŞantiJET BETON R1 — Beton döküm planı, sipariş/irsaliye ve kalite takibi (R1). Mevcut BETON (/beton/) ile ayrı sibling."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/s_logo.png
  adaptive_icon_background: '#05070A'
  adaptive_icon_foreground: assets/images/s_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: '#05070A'
  image: assets/images/s_logo.png
  android_12:
    color: '#05070A'
    image: assets/images/s_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
